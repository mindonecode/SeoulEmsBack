# spring.profiles.active=dev
spring.profiles.active=seoul

#Swagger setting
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#Mybatis setting
mybatis.mapper-locations=classpath:sqlmapper/mysql/**/*.xml
mybatis.config-location=classpath:sqlmapper/config/config.xml

# === 예측 소스 테이블 토글 =========================================
# 예측값(유량/관압/수위)을 조회하는 소비 SQL 이 바라보는 테이블. mapper XML 에서 ${dstrb.prdct.sourceTable} 로 치환됨
# (config.xml 의 <properties resource="application.properties"/> 로 MyBatis 가 이 파일을 읽음 → 반드시 이 공통 파일에 정의).
#  - TB_CTR_TNK_RST          : 외부 파이썬/ML 예측기가 적재한 원본
#  - TB_CTR_TNK_RST_IMPROVED : 계측값 기반 시뮬레이터가 적재한 개선 버전
# 값 변경 후 앱 재기동하면 예측을 읽는 모든 로직이 해당 테이블을 바라본다.
dstrb.prdct.sourceTable=TB_CTR_TNK_RST_IMPROVED

#HikariCP connection pool (공통 - 전 프로파일 상속)
# 기본값(pool-size=10, connection-timeout=30000ms)에서 풀 고갈로 30초 타임아웃 발생하여 명시화.
spring.datasource.hikari.pool-name=EmsHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# max-lifetime 은 DB wait_timeout 보다 작아야 함(MariaDB 기본 28800s 대비 1800s 안전).
spring.datasource.hikari.max-lifetime=1800000
# 20초 이상 점유된 커넥션을 WARN 로그로 남겨 실제 leak 여부 가시화.
spring.datasource.hikari.leak-detection-threshold=20000

#log setting
log.config.path=/workspace/container_volumes/logs/ems_api
log.config.filename=application.log
error.log.config.filename=error.log


logging.level.org.apache.kafka=ERROR
logging.level.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

