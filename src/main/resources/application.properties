spring.profiles.active=dev
# spring.profiles.active=seoul

#Swagger setting
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#Mybatis setting
mybatis.mapper-locations=classpath:sqlmapper/mysql/**/*.xml
mybatis.config-location=classpath:sqlmapper/config/config.xml

#HikariCP connection pool (공통 - 전 프로파일 상속)
# 기본값(pool-size=10, connection-timeout=30000ms)에서 풀 고갈로 30초 타임아웃 발생하여 명시화.
spring.datasource.hikari.pool-name=EmsHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# max-lifetime 은 DB wait_timeout 보다 작아야 함(MariaDB 기본 28800s 대비 1800s 안전).
spring.datasource.hikari.max-lifetime=1800000
# 20초 이상 점유된 커넥션을 WARN 로그로 남겨 실제 leak 여부 가시화.
spring.datasource.hikari.leak-detection-threshold=20000

#log setting
log.config.path=/workspace/container_volumes/logs/ems_api
log.config.filename=application.log
error.log.config.filename=error.log


logging.level.org.apache.kafka=ERROR
logging.level.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

#Tag setting
tag.value.mw.unit=1000
tag.value.mwh.unit=1000
tag.value.uk.unit=0.0000001
tag.value.uKh.unit=0.0000001
tag.value.default.rate.idx=1
tag.value.default.rate.fee=8000
tag.value.default.frq=100
tag.value.default.elec=1000
tag.value.co2=0.424

time.diff.min=2

