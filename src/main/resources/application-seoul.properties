# =====================================================================
# Kafka 더미 설정 — seoul 환경은 SCADA/Kafka 우회 흐름이라 실제로 메시지를
# 주고받지 않지만, KafkaConfig / KafkaConsumerService 의 @Value 가 키 누락 시
# bean 생성 실패로 앱 자체가 기동 안 되므로 placeholder 만 채워줌.
# 운영 Kafka 와 통신하려면 실제 브로커 주소로 교체 필요.
# =====================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers-1=localhost:9092
spring.kafka.bootstrap-servers-2=localhost:9092
spring.kafka.consumer.auto-offset-reset=latest
kafka.topic.name=scada
kafka.topic.scada1.name=scada1
kafka.topic.scada2.name=scada2
kafka.new.group.id=ems-seoul-new
kafka.group.scada1.id=ems-seoul-scada1
kafka.group.scada1_1.id=ems-seoul-scada1-1
kafka.group.scada1_2.id=ems-seoul-scada1-2
kafka.group.scada2.id=ems-seoul-scada2
kafka.group.scada2_1.id=ems-seoul-scada2-1
kafka.group.scada2_2.id=ems-seoul-scada2-2

# === [Seoul/Dev] 부하+수위 기반 단계 조정 설정 =====================
# 공릉배수지(6지) 수위 태그 CSV. avgActiveSeoulWaterLevel 헬퍼가 활성(≥threshold) 평균 산출.
seoul.step.gn.tags=WB01Q0_P_WTDWLM011_ILE,WB01Q0_P_WTDWLM021_ILE,WB01Q0_P_WTDWLM031_ILE,WB01Q0_P_WTDWLM041_ILE,WB01Q0_P_WTDWLM051_ILE,WB01Q0_P_WTDWLM061_ILE
# 북악터널배수지 유입(1·2지) 수위 태그 = 하한 평균. 중간부하(M)/최대부하(H) 안전선 판정에 사용.
seoul.step.ba.tags=WS03Q0_P_WTDWLM011_ILE,WS03Q0_P_WTDWLM021_ILE
# 북악터널배수지 유출(1·2지) 수위 태그 = 상한 평균. 경부하(L) 07:00 목표수위 도달 판정 전용.
seoul.step.ba.upper.tags=WS03Q0_P_WTDWLM012_ILE,WS03Q0_P_WTDWLM022_ILE
# 활성(가동중) 수조 판단 임계 수위 (m). 미만이면 활성에서 제외.
seoul.step.active.threshold=3.0
# 공릉/북악 07:00 목표 수위 (m). 경부하 상승속도 계산에 사용.
# ※ 런타임은 TB_CONFIG(DB) 값이 우선. 아래는 DB 미적용/조회실패 시 폴백 기본값.
seoul.step.gn.target=6.0
seoul.step.ba.target=7.6
# 중간/최대부하 안전선 임계 (m) — 공릉/북악 분리 (기존 seoul.step.mh.threshold 대체).
# 둘다 임계 초과면 감소운영/#1 고정. 런타임은 TB_CONFIG(DB) 우선, 아래는 폴백.
seoul.step.gn.mh.threshold=4.0
seoul.step.ba.mh.threshold=4.0

# === [Seoul] 관압 알람 (A/B/C) : TB_RAWDATA 실측 관압이 기준값 초과 시 알람 팝업 ===
# 태그(분단위 적재) — A/B/C 순서. 임계값(Kg/cm²)은 런타임 TB_CONFIG(DB) 우선, 아래는 폴백.
seoul.pressure.a.tag=PK00KD_P_WTPYPL001_IPR
seoul.pressure.b.tag=PK00KD_P_WTPYPL002_IPR
seoul.pressure.c.tag=PK00KD_P_WTPYPL003_IPR
seoul.pressure.a.threshold=30.0
seoul.pressure.b.threshold=25.0
seoul.pressure.c.threshold=20.0
# 부하(L/M/H) 기반 ±1단계 조정 on/off. false 면 유클리드 거리(closestPointIndex)의 조합을 그대로 사용.
# 현재 OFF: 수위조건(seoul.level-condition.enabled)으로 대체됨.
seoul.step.load-adjust.enabled=false

# === [Seoul] 수위조건 판정 (부하조정을 대체. true 면 seoul.step.load-adjust.enabled 보다 우선) ===
# TB_TARGET_LEVEL 의 배수지별·시간대별(HOURS) 목표수위 상/하한과 현재 수위를 직접 비교한다.
# 목표수위는 USER 설정값(USER_MIN_VL/USER_MAX_VL) 우선, 없으면 기본값(MIN_VL/MAX_VL).
#   공릉 or 북악 현재수위 <= 하한   -> +1단계 (증량)
#   공릉 and 북악 현재수위 >= 상한  -> -1단계 (감량)
#   그 외(하한~상한 사이)           -> 유지(0)
# 판정 불가(활성 수조 0개 또는 그 시간대 목표수위 미설정)면 보수적으로 +1단계.
# TB_CONFIG(DB) 에 같은 키를 넣으면 재기동 없이 토글된다(AppConfigStore 60초 재로딩).
seoul.level-condition.enabled=true

# === [Seoul] 복귀수위 되돌림 (수위조건 안의 히스테리시스만 on/off) ===
# 복귀수위 = (그 시간대 목표수위 상한 + 하한) / 2, 지점별.
#   하한 이탈 -> +1 증량 -> 트리거 지점 전부 cur >= 복귀수위 도달 시 -1 되돌림
#   상한 이탈 -> -1 감량 -> 트리거 지점 전부 cur <= 복귀수위 도달 시 +1 되돌림
# false 면 위 되돌림 판정만 하지 않는다. 대기 행 기록(TB_CTR_LEVEL_RETURN)·발사 표시(DISPATCHED)와
# 그 위에 얹힌 제어주기(LOCK_MIN) 게이트 / '제어주기 내 이탈 억제' 는 그대로 동작한다.
# TB_CONFIG(DB) 에 같은 키를 넣으면 재기동 없이 토글된다.
seoul.level-return.enabled=false

# === [Seoul] 자동·추천 발사 1회당 최대 조합 단계 이동 (0 이하면 가드 off) ===
# 수위조건 판정은 구조상 1단계만 낸다. 그보다 큰 이동이 계산되면 목표 조합이 현장 실측과
# 어긋난 것이므로(실측 조합 조회 실패 → 최소대수 폴백 등) 발사하지 않고 로그만 남긴다.
# 조합 대수 목록(서울 3.0/3.5/4.0/4.5/5.0)에서의 인접 칸 수로 세며, 고정 대수 차가 아니다.
seoul.control.max-step=1

# === [Seoul] 예측 배치 도착 대기 최대 시간(초). 10분 배치 경계 기준, 배치주기 600초보다 작아야 함 ===
# 이 시간이 지나도 예측(TB_CTR_TNK_RST)이 안 들어오면 수위조건만으로 산출을 진행한다.
# 수위조건은 예측 유량·압력을 쓰지 않고 실측 조합 ±1단계로 판단하므로 예측 없이도 성립한다.
# 종전에는 예측이 없으면 그 배치를 통째로 건너뛰어 추천 조합도 발사 기준 슬롯도 생기지 않았다.
seoul.prediction.grace.seconds=120

# 펌프 조합 예측 방식: euclidean(유클리드 최근접, 유량+압력) | flowrange(유량 범위 매칭, 미매칭/중복 시 euclidean 폴백)
pump.predict.mode=flowrange

# === [Seoul] 배수지별 수조 LEI 태그 (≥3m 활성 수조 평균 수위 표출용) ===
# 화면 "수위 변동" 차트가 배수지당 1개 라인을 활성 수조(≥seoul.step.active.threshold) 평균으로 표출.
# 공릉(gn)/북악(ba)는 위 seoul.step.gn.tags / seoul.step.ba.tags 와 동일 값 재사용.
seoul.waterlevel.guri.tags=ZG01Q0_P_WTDWLM011_ILE,ZG01Q0_P_WTDWLM021_ILE
seoul.waterlevel.gn.tags=${seoul.step.gn.tags}
seoul.waterlevel.wg.tags=WB02Q0_P_WTDWLM011_ILE,WB02Q0_P_WTDWLM021_ILE,WB02Q0_P_WTDWLM031_ILE,WB02Q0_P_WTDWLM041_ILE
seoul.waterlevel.wgok.tags=WJ55Q0_P_WTDWLE011_ILE,WJ55Q0_P_WTDWLE021_ILE
seoul.waterlevel.ba.tags=${seoul.step.ba.tags}
# 배수지별 활성 수조 임계 (m). 미설정 시 seoul.step.active.threshold(3.0) 폴백.
# 구리는 수조 운영 수위가 낮아 1.5m 임계 사용.
seoul.waterlevel.guri.threshold=1.5

# === 제어 명령 발사 활성화 (운영) =====================
# 운영(seoul) 에서는 자동/추천 dispatch 활성. dev 에서는 false 로 차단됨.
seoul.control.dispatch.enabled=true

# === [SEOUL] 2단계 제어명령 발사 지연 =====================
# 제어명령 발사 시 먼저 전체 펌프 OFF 명령을 즉시 보내고, 아래 분(minutes) 뒤에
# 실제 예측 제어명령을 보낸다. 0 이하이면 지연 없이 즉시 예측명령 발사(2단계 off).
seoul.control.preoff.delay.minutes=3
