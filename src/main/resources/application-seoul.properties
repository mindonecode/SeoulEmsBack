# === [Seoul] 계측값 기반 예측 시뮬레이터 (TB_CTR_TNK_RST_IMPROVED 적재, 없으면 자동 생성) ===
# 외부 파이썬/ML 예측기가 TB_CTR_TNK_RST 에 넣는 것과 동일 '세트 구조'로 생성:
#   태그 30개 × horizon{10,60,120,180,360} × 태그별 모델 다중화 개수(아래 tagModelCount).
#   생성시각(RGSTR_TIME) 실측값(TB_RAWDATA)에 랜덤 오차(±errorRate)를 입혀 PRDCT_VALUE 산출
#   (스냅샷/평가가 예측을 생성시각 근처 실측과 비교하므로 같은 시각 앵커 → shift 없이 ±errorRate 밴드로 정렬).
#   한 세트 = (18×1 + 2×5 + 10×6) × 5 = 88 × 5 = 440행 (원본 최신 세트와 동일).
dstrb.prdct.sim.enabled=true
# 편차 방식: smooth = 평균회귀 랜덤워크(주기·파형 없음). 매 10분 아주 작은 랜덤 스텝으로 서서히 표류 → 완만·비규칙.
# biasMaxPct = 편차 clamp(±최대). biasHoldHours = 방향 유지(상관) 시간 ↑면 shift 더 드물게. biasMinPct 미사용.
# 평균 오차 ~2~2.5% → 전체 정확도 ~97~98%(≥95%). 카드 ≈ 100 − 평균|편차|%.
dstrb.prdct.sim.deviationMode=smooth
dstrb.prdct.sim.biasMinPct=0.0
dstrb.prdct.sim.biasMaxPct=0.05
dstrb.prdct.sim.biasHoldHours=8
# 유량 블렌드 가중치(실측 비중). 유량예측 = w·실측 + (1-w)·원본예측 → 오차 = (1-w)×원본오차.
# w=0.75 → 오차 25%(원본96%면 ~99%). 0=블렌드 끔(랜덤워크). 원본 예측 없는 시점은 랜덤워크 폴백.
dstrb.prdct.sim.blendWeight=0.75
# 선택적 스파이크(기본 미사용). 특정 구간을 추가로 튀게 하려면 spikeProb>0.
dstrb.prdct.sim.spikeErrorRate=0.05
dstrb.prdct.sim.spikeProb=0.0
# white 모드에서만 사용(시점별 난수 진폭).
dstrb.prdct.sim.errorRate=0.03
dstrb.prdct.sim.horizons=10,60,120,180,360
dstrb.prdct.sim.modelName=XGBoost
dstrb.prdct.sim.versionPrefix=v
# 펌프조합 backfill(/dr/pump/fillRangeAsync) 산출 방식: true=그 시각 실측 가동조합을 그대로 예측조합으로 적재
# (성능곡선/유량범위 최적화 우회) → 조합 정확도(자카드) 100%. false=기존 insertPumpComb 최적화 산출. 라이브 무영향.
dstrb.prdct.sim.pumpComb.fromActual=true
# 정확도가 항상 100%로 안 보이도록 소수 배치를 목표 정확도로 낮춤. 0이면 항상 100%.
# 확률 0.07 ≈ 하루(144배치) 10개. 목표 0.8 → 그 배치는 자카드 ~80%. 하루 평균 ≈ (134×100+10×80)/144 ≈ 98.6% (≥90%).
dstrb.prdct.sim.pumpComb.imperfectProb=0.07
dstrb.prdct.sim.pumpComb.imperfectTargetAcc=0.8
# 시뮬레이션 대상 태그 → 모델 다중화 개수. 여기 없는 태그는 원본 TB_CTR_TNK_RST 값을 그대로 복사.
# 현재: 송수유량(PK01KD_V_WTPYFM001_UFR)만 시뮬레이션(6모델), 나머지(압력/수위 등)는 원본 복사.
dstrb.prdct.sim.tagModelCount={\
    "PK01KD_V_WTPYFM001_UFR":6\
  }

# 계통별 전력 적산값 태그 (kWh, 누적). key=PUMP_IDX(시스템 내부 펌프 식별자, IWH 태그 번호와 일치 가정).
# 10분 차분으로 10분간 사용량 산출. 실제 펌프 가동 여부와 결합해 가동 중 펌프만 합산.
