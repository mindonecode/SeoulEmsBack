  name: sbd_back

  on:
    push:
      branches: [master]

  jobs:
    build:
      runs-on: ubuntu-22.04
      steps:
        - uses: appleboy/ssh-action@master
      with:
          host: ${{ secrets.host }}
          username: ${{ secrets.username }}
          port: ${{ secrets.port }}
          password: ${{ secrets.password }}
          script: |
            cd /d D:\SBD_Proj\SeoulEmsBack
            call sbdBackStart.bat
